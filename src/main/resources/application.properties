spring.application.name=baza

app.telegram.token=${TELEGRAM_TOKEN}
app.telegram.url=https://api.telegram.org/bot
app.telegram.update-listener-sleep=1s

server.port=8080

spring.jpa.hibernate.ddl-auto=update

spring.ai.google.genai.api-key=${GEMINI_API_KEY:dummy-key-for-test}
spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT:dummy-project}
spring.ai.google.genai.location=us-central1
spring.ai.google.genai.chat.options.model=gemini-3.5-flash

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:dummy-key-for-test}
spring.ai.google.genai.embedding.project-id=${GOOGLE_CLOUD_PROJECT:dummy-project}
spring.ai.google.genai.embedding.location=us-central1
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=jdbc:postgresql://localhost:5432/baza_db
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

app.battle.duration-minutes=10
app.battle.default-elo=1000

app.digest.cron=0 0 12 * * ?
app.digest.days=7

app.bot.search-limit=50
app.bot.complaints-threshold=3

app.dedup.image-phash-threshold=5

app.meme.async-concurrency=16

# AI resilience
app.ai.timeout-ms=30000
app.ai.retry.max-attempts=3
app.ai.retry.initial-interval=1000
app.ai.retry.multiplier=2
app.ai.retry.max-interval=8000
# Circuit breaker
app.ai.circuit-breaker.failure-rate-threshold=50
app.ai.circuit-breaker.slow-call-rate-threshold=80
app.ai.circuit-breaker.slow-call-duration-threshold=10s
app.ai.circuit-breaker.wait-duration-in-open-state=30s
app.ai.circuit-breaker.sliding-window-size=20
app.ai.circuit-breaker.minimum-number-of-calls=10
# AI processing queue
app.ai.queue.concurrency=4
app.ai.queue.retry-delay-ms=5000
app.ai.queue.retry-multiplier=2.0
app.ai.queue.retry-max-delay-ms=3600000
app.ai.queue.max-retries=10
# AI give-up: удалить PENDING-мем и уведомить пользователя через N часов неуспешных ретраев
app.ai.give-up-hours=48
# AI image cache (in-memory, pipeline-scoped)
app.ai.image-cache.ttl-minutes=60
app.ai.image-cache.max-size=500
app.ai.image-cache.max-weight-mb=256
# AI reprocess scheduler (orphaned PENDING memes)
app.ai.reprocess.interval-ms=300000
app.ai.reprocess.minutes-threshold=5

# Moderation cleanup
app.moderation.quarantine-ttl-days=7

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:baza}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:baza}
spring.rabbitmq.listener.simple.retry.enabled=false
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Actuator / metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
