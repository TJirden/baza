<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baza Admin Panel</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background: #f0f0f0; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { padding: 10px 20px; border: none; background: #ddd; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .nav-btn.active { background: #0088cc; color: white; }

        .search-bar { margin-bottom: 20px; display: flex; gap: 10px; }
        .search-bar input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .search-bar button { padding: 10px 20px; background: #0088cc; color: white; border: none; border-radius: 4px; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: auto; border-radius: 4px; margin-bottom: 10px; }
        .card .desc { font-weight: bold; margin-bottom: 10px; }
        .card .meta { font-size: 11px; color: #666; margin-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #0088cc; color: white; }

        .btn { padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-delete { background: #e74c3c; color: white; }
        .btn-edit { background: #f1c40f; color: #333; margin-right: 5px; }
        
        .hidden { display: none; }
        .actions { display: flex; justify-content: flex-end; }
    </style>
</head>
<body>
    <h1>Baza Admin</h1>
    
    <div class="nav">
        <button class="nav-btn active" id="btn-memes" onclick="showTab('memes')">Мемы</button>
        <button class="nav-btn" id="btn-moderation" onclick="showTab('moderation')">Карантин</button>
        <button class="nav-btn" id="btn-users" onclick="showTab('users')">Пользователи</button>
        <button class="nav-btn" id="btn-groups" onclick="showTab('groups')">Группы</button>
    </div>

    <div class="search-bar" id="search-bar-container">
        <input type="text" id="admin-search" placeholder="Поиск в текущей вкладке..." onkeypress="if(event.key==='Enter') performSearch()">
        <button onclick="performSearch()">Найти</button>
        <button onclick="clearSearch()" style="background:#888">Сброс</button>
    </div>

    <div id="memes-tab">
        <div id="memes-grid" class="grid"></div>
    </div>

    <div id="moderation-tab" class="hidden">
        <div id="moderation-grid" class="grid"></div>
    </div>

    <div id="users-tab" class="hidden">
        <table>
            <thead><tr><th>ID</th><th>Username</th><th>Name</th><th>Действия</th></tr></thead>
            <tbody id="users-body"></tbody>
        </table>
    </div>

    <div id="groups-tab" class="hidden">
        <table>
            <thead><tr><th>ID</th><th>Название</th><th>Владелец</th><th>Действия</th></tr></thead>
            <tbody id="groups-body"></tbody>
        </table>
    </div>

    <script>
        let currentTab = 'memes';

        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
            
            document.getElementById('memes-tab').classList.add('hidden');
            document.getElementById('moderation-tab').classList.add('hidden');
            document.getElementById('users-tab').classList.add('hidden');
            document.getElementById('groups-tab').classList.add('hidden');
            document.getElementById(tab + '-tab').classList.remove('hidden');
            
            const searchBar = document.getElementById('search-bar-container');
            if (tab === 'users' || tab === 'groups' || tab === 'moderation') {
                searchBar.classList.add('hidden');
            } else {
                searchBar.classList.remove('hidden');
            }

            document.getElementById('admin-search').value = '';
            loadData(tab);
        }

        async function loadData(tab, query = '') {
            const container = document.getElementById(tab === 'memes' || tab === 'moderation' ? tab + '-grid' : tab + '-body');
            container.innerHTML = tab === 'memes' || tab === 'moderation' ? 'Загрузка...' : '<tr><td colspan="4">Загрузка...</td></tr>';
            
            let url = `/api/admin/${tab}`;
            if (tab === 'memes' && query) {
                url = `/api/admin/memes/search?q=${encodeURIComponent(query)}`;
            }
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                container.innerHTML = '';
                
                if (data.length === 0) {
                    container.innerHTML = tab === 'memes' || tab === 'moderation' ? 'Ничего не найдено' : '<tr><td colspan="4">Ничего не найдено</td></tr>';
                    return;
                }

                if (tab === 'memes') {
                    data.forEach(meme => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <img src="/api/memes/image/${meme.fileId}" alt="meme">
                            <div class="desc">${escapeHtml(meme.description)}</div>
                            <div class="meta">ID: ${meme.id} | Owner: ${meme.ownerId}</div>
                            <div class="actions">
                                <button class="btn btn-edit" onclick="editMeme('${meme.id}', '${meme.description.replace(/'/g, "\\'")}')">Edit</button>
                                <button class="btn btn-delete" onclick="deleteItem('memes', '${meme.id}')">Delete</button>
                            </div>`;
                        container.appendChild(card);
                    });
                } else if (tab === 'moderation') {
                    data.forEach(m => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <img src="/api/memes/image/${m.fileId}" alt="quarantined meme">
                            <div class="desc">${escapeHtml(m.description)}</div>
                            <div class="meta" style="color: #e74c3c; font-weight: bold; margin-bottom: 10px;">Причина: ${escapeHtml(m.moderationReason)}</div>
                            <div class="meta">ID: ${m.id} | Owner: ${m.ownerId}</div>
                            <div class="actions">
                                <button class="btn" style="background: #2ecc71; color: white; margin-right: 5px;" onclick="approveMeme('${m.id}')">Approve</button>
                                <button class="btn btn-delete" onclick="rejectMeme('${m.id}')">Reject</button>
                            </div>`;
                        container.appendChild(card);
                    });
                } else if (tab === 'users') {
                    data.forEach(u => {
                        const row = document.createElement('tr');
                        row.innerHTML = `<td>${u.id}</td><td>${escapeHtml(u.username || 'N/A')}</td><td>${escapeHtml(u.firstName || 'N/A')}</td>
                            <td><button class="btn btn-delete" onclick="deleteItem('users', '${u.id}')">Del</button></td>`;
                        container.appendChild(row);
                    });
                } else if (tab === 'groups') {
                    data.forEach(g => {
                        const row = document.createElement('tr');
                        row.innerHTML = `<td>${g.id}</td><td>${escapeHtml(g.name)}</td><td>${g.owner ? escapeHtml(g.owner.username) : 'N/A'}</td>
                            <td><button class="btn btn-delete" onclick="deleteItem('groups', '${g.id}')">Del</button></td>`;
                        container.appendChild(row);
                    });
                }
            } catch (e) { container.innerHTML = 'Ошибка загрузки'; }
        }

        function performSearch() {
            const q = document.getElementById('admin-search').value;
            loadData(currentTab, q);
        }

        function clearSearch() {
            document.getElementById('admin-search').value = '';
            loadData(currentTab);
        }

        async function deleteItem(type, id) {
            if (!confirm('Удалить?')) return;
            await fetch(`/api/admin/${type}/${id}`, { method: 'DELETE' });
            loadData(currentTab);
        }

        async function editMeme(id, oldDesc) {
            const desc = prompt('Новое описание:', oldDesc);
            if (!desc || desc === oldDesc) return;
            await fetch(`/api/admin/memes/${id}`, {
                method: 'PATCH',
                body: desc
            });
            loadData(currentTab);
        }

        async function approveMeme(id) {
            if (!confirm('Одобрить мем?')) return;
            const res = await fetch(`/api/admin/moderation/${id}/approve`, { method: 'POST' });
            if (res.ok) {
                loadData('moderation');
            } else {
                alert('Не удалось одобрить мем.');
            }
        }

        async function rejectMeme(id) {
            const reason = prompt('Укажите причину отклонения мема:', 'Нарушение правил сообщества');
            if (reason === null) return;
            const res = await fetch(`/api/admin/moderation/${id}/reject`, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: reason
            });
            if (res.ok) {
                loadData('moderation');
            } else {
                alert('Не удалось отклонить мем.');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        loadData('memes');
    </script>
</body>
</html>
